</style><link rel="stylesheet" href="game-select.css?v=campaign-complete-20261112-r1"><main><header><a href="./">← 回到拳民開講</a><small>漫畫招式 / ART 18</small></header><h1>每一招，慢慢看。</h1><p>同一套漫畫人物，接進原本的招式。這裡只檢視美術與動作，不做命中判定。</p><section><nav><select id="character" aria-label="角色"><option value="wang">恰吉王</option><option value="han">韓國魚</option></select><select id="move" aria-label="招式"></select><button id="flip">左右翻面 ⇄</button><button id="play">暫停</button><select id="speed" aria-label="播放速度"><option value=".25">0.25×</option><option value=".5" selected>0.5×</option><option value="1">1×</option></select></nav><canvas id="art" width="900" height="440" aria-label="漫畫角色招式預覽"></canvas><div class="controls"><label><span id="time">0.00s</span><input id="timeline" type="range" min="0" max="1.4" step=".005" value="0" aria-label="動作時間軸"></label></div></section><p id="note">正在載入漫畫素材，請稍候。</p><p><a href="moves.html">查看現有招式設計與原聲狀態 →</a></p><footer>手部與杯子採連體素材；左掌、右手背與衣袖保留固定前後層級。翻面是整體鏡像，並非另一套反向解剖素材。原創漫畫諷刺，非當事人代言。</footer></main><script type="module" src="art-view.mjs?v=campaign-complete-20261112-r1"></script><script type="module" src="game-select-boot.mjs?v=campaign-complete-20261112-r1"></script></html>
