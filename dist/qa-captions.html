<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>招式框視覺檢查</title><style>body{margin:12px;background:#e8e4d5;font:16px system-ui}button{padding:8px;margin:4px}canvas{display:block;background:#d4cbaa;border:1px solid #777}pre{white-space:pre-wrap}</style><h1>無框漫畫喊話 · 直向／橫向／側轉</h1><p>使用正式角色繪製與無框喊話排版；左右色彩區分，不追隨角色。</p><button data-mode="portrait">390×640 直向</button><button data-mode="normal">844×390 雙方發招</button><button data-mode="edge">667×320 靠邊</button><button data-mode="flip">667×320 側轉</button><button data-mode="knee">844×390 蹲跪</button><button data-mode="burst">強招鋸齒 1100×600</button><button data-mode="burstphone">強招鋸齒 667×320</button><canvas></canvas><pre id="result"></pre><script type="module">
import {ART_FILES,drawFighterArt} from './art-render.mjs?v=workers-background-only-20261113-r1';
import {fighterPose} from './art-motion.mjs?v=workers-background-only-20261113-r1';
import {moveCaption} from './move-readability.mjs?v=workers-background-only-20261113-r1';
import {shoutCaptionLayout,comicAccentState,paintComicAccent} from './shout-caption.mjs?v=workers-background-only-20261113-r1';
const images=Object.fromEntries(await Promise.all(Object.entries(ART_FILES).map(async([k,v])=>{const im=new Image();im.src='assets/'+v;await im.decode();return[k,im]})));
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function show(mode){const small=['edge','flip','burstphone'].includes(mode),width=mode==='burst'?1100:mode==='portrait'?390:small?667:844,height=mode==='burst'?600:mode==='portrait'?640:small?320:390;canvas.width=width;canvas.height=height;
const fs=mode==='knee'?[{id:'player',type:'han',x:350,y:430,face:1,attack:{kind:'han_knee',age:.5}},{id:'enemy',type:'ma',x:580,y:430,face:-1,attack:{kind:'ma_gaze',age:.3}}]:[{id:'player',type:'ma',x:mode==='edge'?190:390,y:430,face:mode==='flip'?-1:1,attack:{kind:'ma_gaze',age:.3}},{id:'enemy',type:'ko',x:mode==='edge'?280:520,y:430,face:mode==='flip'?1:-1,attack:{kind:'ko_resolve',age:.3}}];
if(mode.startsWith('burst')){fs[0].type='han';fs[0].attack={kind:'arrow',age:.2};fs[1].type='huang';fs[1].attack={kind:'huang_shout',age:.3};}
const view={x:480,y:270,width,height,zoom:mode==='portrait'?.6:1};const entries=fs.map(f=>({f,pose:fighterPose(f),caption:moveCaption(f.attack.kind)}));const ps=entries.map(e=>shoutCaptionLayout(e.caption.text,e.f.id,view,{top:64,bottom:90},{kind:e.f.attack.kind,actor:e.f.type}));
ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(width/2,height/2);ctx.scale(view.zoom,view.zoom);ctx.translate(-480,-270);

const g={setAlpha(a){ctx.globalAlpha=a;return this},lineBetween(a,b,c,d){ctx.beginPath();ctx.moveTo(this.x+a,this.y+b);ctx.lineTo(this.x+c,this.y+d);ctx.stroke()},clear(){return this},setVisible(){return this},setPosition(x,y){this.x=x;this.y=y;return this},lineStyle(w,c,a){ctx.lineWidth=w;ctx.strokeStyle='#'+c.toString(16);ctx.globalAlpha=a;return this},beginPath(){ctx.beginPath()},moveTo(x,y){ctx.moveTo(this.x+x,this.y+y)},lineTo(x,y){ctx.lineTo(this.x+x,this.y+y)},closePath(){ctx.closePath()},strokePath(){ctx.stroke();ctx.globalAlpha=1}};
ps.forEach((p,i)=>paintComicAccent(g,p,comicAccentState(400,1350)));ctx.globalAlpha=1;for(const f of fs){ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.face,1);drawFighterArt(ctx,images,f);ctx.restore()}
ps.forEach((p,i)=>{ctx.save();ctx.textAlign='center';ctx.font='bold '+(12/view.zoom)+'px system-ui';ctx.lineWidth=4/view.zoom;ctx.strokeStyle='#102934';ctx.fillStyle=p.style.accent;ctx.strokeText(p.tag,p.x,p.y+(p.tagY-p.screenY)/view.zoom);ctx.fillText(p.tag,p.x,p.y+(p.tagY-p.screenY)/view.zoom);ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;ctx.strokeStyle='#102934';ctx.lineWidth=6/view.zoom;ctx.lineJoin='round';ctx.shadowColor='#071b25';ctx.shadowOffsetX=3/view.zoom;ctx.shadowOffsetY=4/view.zoom;ctx.shadowBlur=2;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='italic 900 '+(p.size/view.zoom)+'px system-ui';p.text.split('\n').forEach((line,j,lines)=>{const y=(j-(lines.length-1)/2)*p.size*1.18/view.zoom;ctx.strokeText(line,0,y);ctx.fillText(line,0,y)});ctx.restore();});ctx.restore();document.querySelector('#result').textContent=JSON.stringify(ps.map(p=>({slot:p.slot,x:p.x,y:p.y,font:p.size,subtitle:p.showSubtitle})),null,2);}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.mode));show('normal');
</script></html>
