<!doctype html><meta charset="utf-8"><title>聲浪桌面判定驗證</title><button id="portrait">直向</button><button id="jump">桌上起跳</button><button id="guard">桌上防守</button><button id="landscape">橫向</button><button id="both">雙方集結</button><button id="rush">全團衝出</button><button id="impact">雙方出擊瞬間</button><canvas></canvas><script type="module">
import {Duel} from './core.mjs?v=post69-street-seam-cull-20261112-r1';import {CHAMBER,DESK,paintStageCrowd,supporterFormation} from './stage-expansion.mjs?v=post69-street-seam-cull-20261112-r1';import {ART_FILES,drawFighterArt} from './art-render.mjs?v=post69-street-seam-cull-20261112-r1';import {stableCameraFrame} from './arena-presentation.mjs?v=post69-street-seam-cull-20261112-r1';
const c=document.querySelector('canvas'),ctx=c.getContext('2d');const images=Object.fromEntries(await Promise.all(Object.entries(ART_FILES).map(async([k,v])=>{let i=new Image();i.src='assets/'+v;await i.decode();return[k,i]})));for(const type of ['woman','man','elder','young','grandma']){const im=new Image();im.src='assets/supporter-'+type+(['woman','man'].includes(type)?'-v46.png':'-v48.png');await im.decode();images['supporter-'+type]=im;}const bg=new Image();bg.src='assets/arena-chamber-v19.webp';await bg.decode();
const g={strokeEllipse(x,y,w,h){ctx.beginPath();ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);ctx.stroke()},clear(){},fillStyle(c,a=1){ctx.fillStyle='#'+c.toString(16).padStart(6,'0');ctx.globalAlpha=a},lineStyle(w,c,a=1){ctx.lineWidth=w;ctx.strokeStyle='#'+c.toString(16).padStart(6,'0');ctx.globalAlpha=a},lineBetween(x,y,x2,y2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()},fillRect(x,y,w,h){ctx.fillRect(x,y,w,h)},fillRoundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()},fillCircle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()},strokeCircle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}};
function show(w=844,h=390,both=false,age=0,action=""){c.width=w;c.height=h;const d=new Duel();d.player.x=350;d.player.y=DESK.y;d.player.supportY=DESK.y;d.enemy.x=650;d.enemy.y=d.enemy.supportY=DESK.y;d.player.rally=100;d.request(d.player,'rally');if(both){d.enemy.rally=100;d.request(d.enemy,'rally');}for(let n=0;n<Math.round(age*60);n++){if(action==="jump"&&n===38)d.request(d.enemy,"jump");d.step(1/60,{},false,action==="guard"?{guard:true}:{});}const f=stableCameraFrame(w,h,[d.player,d.enemy]);ctx.save();ctx.translate(w/2,h/2);ctx.scale(f.zoom,f.zoom);ctx.translate(-f.x,-f.y);ctx.drawImage(bg,CHAMBER.x-CHAMBER.width/2,CHAMBER.y-CHAMBER.floorRatio*CHAMBER.height,CHAMBER.width,CHAMBER.height);paintStageCrowd(g,d);for(const m of supporterFormation(d,1100,false,f)){const im=images[m.asset];ctx.save();ctx.globalAlpha=m.alpha;ctx.translate(m.x,m.y);ctx.rotate(m.rotation);const w=m.height*im.width/im.height;ctx.drawImage(im,-w/2,-m.height,w,m.height);ctx.restore();}ctx.globalAlpha=1;for(const p of [d.player,d.enemy]){ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.face,1);drawFighterArt(ctx,images,p,1100);ctx.restore();}for(const r of d.rallies){ctx.save();ctx.fillStyle=r.owner.id==='player'?'#ffdb62':'#9ae9ff';ctx.strokeStyle='#17323b';ctx.lineWidth=5/f.zoom;ctx.font=`bold ${32/f.zoom}px sans-serif`;ctx.textAlign='center';const copy=r.age<1.05?'借過！':r.result==='miss'?'躲開！':r.result==='blocked'?'格擋 −2':'眾聲轟！ −22';ctx.strokeText(copy,r.targetX,r.targetY-65);ctx.fillText(copy,r.targetX,r.targetY-65);ctx.restore();}ctx.restore();ctx.fillStyle='#fff5d8';ctx.fillRect(0,h-22,w,22);ctx.fillStyle='#17323b';ctx.font='14px sans-serif';ctx.fillText(`P1 ${d.player.hp} / P2 ${d.enemy.hp} · 桌上${action||'站立'} · ${age.toFixed(2)} 秒`,8,h-6);}
document.querySelector('#portrait').onclick=()=>show(390,640);document.querySelector('#landscape').onclick=()=>show();document.querySelector('#both').onclick=()=>show(844,390,true);document.querySelector('#rush').onclick=()=>show(844,390,true,.85);document.querySelector('#impact').onclick=()=>show(844,390,true,1.16);document.querySelector('#jump').onclick=()=>show(844,390,false,1.16,'jump');document.querySelector('#guard').onclick=()=>show(844,390,false,1.16,'guard');show();</script>
