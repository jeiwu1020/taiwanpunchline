<!doctype html><meta charset="utf-8"><title>實際控制區域驗證</title><style>html,body{overflow:auto!important;background:#aaa!important}#cases{display:flex;flex-wrap:wrap;gap:15px}article{display:block}pre{white-space:pre-wrap}.app{position:relative!important;transform:none!important;display:block!important;height:auto!important;margin:0!important;padding:0!important}.cabinet{display:grid!important;grid-template-rows:40px 192px!important}.stage-wrap{height:40px!important;display:block!important}.control-deck{visibility:visible!important}</style><h2>手機實際按鍵邊界檢查</h2><pre id="report">載入中</pre><div id="cases"></div><script type="module">
const doc=new DOMParser().parseFromString(await(await fetch('index.html')).text(),'text/html');await Promise.all([...doc.querySelectorAll('link[rel=stylesheet]')].map(link=>new Promise(resolve=>{const el=link.cloneNode();el.onload=resolve;document.head.append(el)})));const results=[];for(const width of [280,288,320,360,375,390,414,430]){const article=document.createElement('article');article.innerHTML=`<h3>可用寬 ${width}px</h3><div class="app" data-touch="true" data-layout="portrait" data-overlay-controls="false" style="width:${width}px"><div class="cabinet"><div class="stage-wrap"></div></div></div>`;const deck=doc.querySelector('.control-deck').cloneNode(true);article.querySelector('.cabinet').append(deck);document.querySelector('#cases').append(article);}
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));for(const article of document.querySelectorAll('article')){const app=article.querySelector('.app'),bounds=app.getBoundingClientRect(),els=[...article.querySelectorAll('.specials button,.basic button,.touch-aux button,#touch-stick')],boxes=els.map(e=>({name:e.getAttribute('data-action')||e.id,r:e.getBoundingClientRect()}));const failures=[];for(let i=0;i<boxes.length;i++){const a=boxes[i];if(a.r.width<44||a.r.height<44)failures.push(a.name+' too small');if(a.r.left<bounds.left||a.r.right>bounds.right)failures.push(a.name+' outside');for(const b of boxes.slice(i+1)){if(Math.min(a.r.right,b.r.right)-Math.max(a.r.left,b.r.left)>.5&&Math.min(a.r.bottom,b.r.bottom)-Math.max(a.r.top,b.r.top)>.5)failures.push(a.name+' overlaps '+b.name);}}results.push({width:bounds.width,pass:!failures.length,failures,areas:boxes.map(b=>({name:b.name,width:b.r.width,height:b.r.height}))});}document.querySelector('#report').textContent=JSON.stringify(results,null,2);
</script>
