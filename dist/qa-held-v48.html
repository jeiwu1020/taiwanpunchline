<!doctype html><meta charset="utf-8"><title>七角色持物檢查</title><style>body{background:#e1d0ae;font:16px sans-serif}canvas{display:block}button{padding:10px}</style><button data-pose="-1">待機</button><button data-pose="0">第一招</button><button data-pose="1">第二招</button><button data-pose="2">第三招</button><button id="mirror">鏡像</button><canvas width="1120" height="340"></canvas><script type="module">
import{Duel}from'./core.mjs?v=campaign-boot-20261112-r3';import{CAST}from'./roster.mjs?v=campaign-boot-20261112-r3';import{ART_FILES,drawFighterArt}from'./art-render.mjs?v=campaign-boot-20261112-r3';import{fighterPose}from'./art-motion.mjs?v=campaign-boot-20261112-r3';import{ITEM_ART,chooseCarryHand,heldItemAnchor}from'./item-presentation.mjs?v=campaign-boot-20261112-r3';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),images=Object.fromEntries(await Promise.all(Object.entries(ART_FILES).map(async([k,v])=>{let im=new Image();im.src='assets/'+v;await im.decode();return[k,im]})));for(const a of Object.values(ITEM_ART)){let im=new Image();im.src=a.file;await im.decode();images[a.key]=im}let mode=-1,face=1;function draw(){ctx.clearRect(0,0,c.width,c.height);Object.entries(CAST).forEach(([type,cast],i)=>{let f=new Duel(type).player;f.x=0;f.y=0;f.face=face;f.item={kind:i%2?'paper':'rubber_duck'};let hand=chooseCarryHand(fighterPose(f));if(mode>=0)f.attack={kind:cast.moves[mode].kind,age:type==='wang'&&mode===0?.25:.3};ctx.save();ctx.translate(i*160+80,290);ctx.scale(.85,.85);ctx.save();ctx.scale(face,1);const pose=drawFighterArt(ctx,images,f,500);ctx.restore();const a=heldItemAnchor(f,pose,hand),art=ITEM_ART[f.item.kind];ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rotation);ctx.scale(a.flip?-1:1,1);ctx.drawImage(images[art.key],-art.width*a.scale/2,-art.height*a.scale/2,art.width*a.scale,art.height*a.scale);ctx.restore();ctx.restore();ctx.fillStyle='#16323b';ctx.fillText(cast.name,i*160+25,315);ctx.fillText(mode>=0?cast.moves[mode].name:'待機／較低手',i*160+25,335);});}document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{mode=+b.dataset.pose;draw()});document.querySelector('#mirror').onclick=()=>{face*=-1;draw()};draw();</script>
