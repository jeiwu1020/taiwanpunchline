<!doctype html><meta charset="utf-8"><title>V73 版面測試</title><style>body{margin:0;background:#17353a;color:white}header{height:50px}button{padding:10px}iframe{border:0;display:block;margin:auto}</style><header><button data-size="1200,750" data-desktop>電腦</button><button data-size="960,640" data-desktop>窄電腦</button><button data-size="390,740">手機直向</button><button data-size="320,640">窄直向</button><button data-size="360,740">360直向</button><button data-size="430,860">寬直向</button><button data-size="844,390">手機橫向</button><button data-size="568,320">小橫向</button></header><iframe id="qa" width="1200" height="750" src="index.html"></iframe><script>const f=document.querySelector('iframe');let desktop=true;for(const b of document.querySelectorAll('button'))b.onclick=()=>{[f.width,f.height]=b.dataset.size.split(',');const d=b.hasAttribute('data-desktop');if(d!==desktop){desktop=d;f.src='index.html'+(d?'':'?touchPreview')}};</script>
