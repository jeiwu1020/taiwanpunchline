<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local face-off centering QA</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142b32}#viewport-shell{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;overflow:hidden;background:repeating-linear-gradient(0deg,#314e52 0 39px,#476165 40px)}#viewport-shell>.app{position:relative!important;margin:0!important;padding:0!important;max-width:none!important;background:transparent!important}#qa-status{position:fixed;bottom:0;left:0;z-index:1;margin:0;color:white;background:#142b32;font:12px monospace;padding:4px}</style><div id="viewport-shell"><main class="app" data-title-open="false"></main></div><pre id="qa-status">Loading local production assets…</pre><script type="module">
// Read-only isolated renderer. Does not import game.mjs, a progress store or save APIs.
const params=new URLSearchParams(location.search),root=location.pathname.includes('/docs/')?new URL('../../dist/',location.href):new URL('./',location.href);
const source=await(await fetch(new URL('index.html',root))).text(),html=new DOMParser().parseFromString(source,'text/html');
await Promise.all([...html.querySelectorAll('link[rel="stylesheet"]')].map(source=>new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href=new URL(source.getAttribute('href'),root);link.onload=resolve;link.onerror=reject;document.head.append(link);}))); // Same production CSS order.
const shell=document.querySelector('#viewport-shell'),app=document.querySelector('.app');
const mode=params.get('layout')||'desktop',rotation=mode==='sideways'?90:mode==='sideways-left'?-90:0;
const width=Number(params.get('w'))||(rotation?innerHeight:innerWidth),height=Number(params.get('h'))||(rotation?innerWidth:innerHeight);
Object.assign(app.dataset,{rotation:String(rotation),layout:width>height?'landscape':'portrait',touch:String(mode!=='desktop'),compact:String(height<=480)});
Object.assign(app.style,{width:width+'px',height:height+'px'});
Object.assign(shell.style,{width:(rotation?height:width)+'px',height:(rotation?width:height)+'px'});
const [{mountChallengeStory},{paintChallengeStory},{ART_FILES},{CHALLENGE_ART_FILES},{BOSS_DIALOGUES}]=await Promise.all(['challenge-story.mjs?v=75','challenge-story-art.mjs?v=75','art-render.mjs?v=75','challenge-art.mjs?v=75','challenge-flow.mjs?v=65'].map(file=>import(new URL(file,root))));
const images={};await Promise.all(Object.entries({...ART_FILES,...CHALLENGE_ART_FILES}).filter(([key])=>!key.startsWith('opening-')).map(([key,file])=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{images[key]=image;resolve();};image.onerror=reject;image.src=new URL('assets/'+file,root);}))); 
const story=mountChallengeStory({document,paint:(canvas,beat,character,time,options)=>paintChallengeStory(canvas,images,beat,character,time,options)});
story.show(BOSS_DIALOGUES[Number(params.get('boss'))||0],{characterId:params.get('character')||'han'});
const metrics=()=>{const dialog=document.querySelector('.challenge-story'),box=dialog.getBoundingClientRect(),frame=shell.getBoundingClientRect(),next=dialog.querySelector('[data-story-next]').getBoundingClientRect();return{layout:mode,rotation,dialog:{x:box.x,y:box.y,width:box.width,height:box.height},shell:{x:frame.x,y:frame.y,width:frame.width,height:frame.height},centerDelta:{x:box.x+box.width/2-frame.x-frame.width/2,y:box.y+box.height/2-frame.y-frame.height/2},buttonVisible:next.left>=frame.left&&next.right<=frame.right&&next.top>=frame.top&&next.bottom<=frame.bottom,dialogFits:box.left>=frame.left-.5&&box.right<=frame.right+.5&&box.top>=frame.top-.5&&box.bottom<=frame.bottom+.5,scrollHeight:dialog.scrollHeight,clientHeight:dialog.clientHeight};};
window.__faceoffQA={metrics};requestAnimationFrame(()=>document.querySelector('#qa-status').textContent=JSON.stringify(metrics()));
</script></html>
