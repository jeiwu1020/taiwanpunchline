<!doctype html><meta charset="utf-8"><title>街道試玩版面驗證</title><style>body{font:16px system-ui;margin:8px;background:#bbb}button{font:inherit;margin:3px;padding:7px}#frame{transform-origin:top left;border:1px solid #000;margin-top:8px;width:390px;height:844px;transform:scale(.78)}small{display:block}</style><div id="toolbar"><button data-size="390,844">直向 390×844</button><button data-size="844,390">橫向 844×390</button><button data-size="360,640">小直向 360×640</button><button id="comic">漫畫測試</button><button id="original">原版首頁</button><button id="reload">重載試玩</button><small>測試框架只改容器尺寸，不讀寫遊戲存檔。</small></div><iframe id="frame" src="index.html?touchPreview"></iframe><script>const frame=document.querySelector('#frame');for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1,(innerHeight-100)/h)+')';};document.querySelector('#comic').onclick=()=>{frame.src='index.html?touchPreview'};document.querySelector('#original').onclick=()=>{frame.src='index.html?touchPreview'};document.querySelector('#reload').onclick=()=>{frame.src='street-trial.html'};</script>
