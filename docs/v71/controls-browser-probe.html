<!doctype html><meta charset="utf-8"><title>拳民開講控制版面驗證</title><style>body{margin:0;background:#d4ccba;font:14px 'Microsoft JhengHei',sans-serif;color:#17353a}#tools{padding:7px;height:58px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}button{font:inherit;border:2px solid #17353a;border-radius:6px;background:#fff2d4;padding:5px 10px;cursor:pointer}#holder{position:relative;overflow:visible;margin:0 auto}iframe{border:0;display:block;transform-origin:top left;position:absolute;top:0;left:0}</style><div id="tools"><b>控制驗證</b><button data-size="390,650">直向</button><button data-size="390,600">短直向</button><button data-size="320,568">小直向</button><button data-size="844,390">橫向</button><button data-size="740,360">小橫向</button><button data-size="650,360">650橫向</button><button data-size="390,844">高直向</button><button data-size="1200,750" data-desktop>電腦</button><button data-reload>重載</button></div><div id="holder"><iframe id="frame" src="index.html?touchPreview"></iframe></div><script>const frame=document.querySelector('#frame'),holder=document.querySelector('#holder');let size=[390,650],desktop=false;function fit(){const [w,h]=size,s=Math.min(1,(innerHeight-65)/h,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';holder.style.width=w*s+'px';holder.style.height=h*s+'px';}for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{size=b.dataset.size.split(',').map(Number);const next=b.hasAttribute('data-desktop');if(next!==desktop){desktop=next;frame.src='index.html'+(desktop?'':'?touchPreview');}fit()};document.querySelector('[data-reload]').onclick=()=>{frame.src='index.html'+(desktop?'':'?touchPreview')};addEventListener('resize',fit);fit();</script>
<pre id="input-observation" style="position:fixed;bottom:0;left:0;margin:0;padding:2px 6px;background:#fff;color:#17353a;font:11px monospace;pointer-events:none;z-index:99"></pre><script>
frame.addEventListener('load',()=>{const d=frame.contentDocument;for(const type of ['keydown','keyup'])d.addEventListener(type,event=>{if(!['Space','KeyW'].includes(event.code))return;requestAnimationFrame(()=>{const b=d.querySelector('#challenge-jump'),s=d.defaultView.getComputedStyle(b);document.querySelector('#input-observation').textContent+='\n'+type+' '+event.code+' class='+b.className+' transform='+s.transform;});},true);});
</script>
