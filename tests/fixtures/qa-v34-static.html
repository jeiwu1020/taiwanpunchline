<!doctype html><meta charset="utf-8"><title>V34 static gesture and rotation fixture</title><style>body{margin:0;background:#263e45;color:#fff;font:12px system-ui}iframe{display:block;border:0;margin:0;transform-origin:top left}pre{white-space:pre-wrap;font-size:10px}button{font:inherit;padding:8px}</style><p>V34 frozen production-art fixture, not live gameplay. <span id="fixture-action"></span></p><nav><button data-size="390,844">390 portrait</button><button data-size="844,390">844 landscape</button><button data-size="320,568">320 portrait</button><button data-size="480,320">480 landscape</button><button data-msg="toggle-rotate">Toggle rotation</button><button data-msg="toggle-pause">Pause text</button><button data-msg="measure">Measure</button></nav><div id="holder"><iframe title="V34 fixed pose"></iframe></div><pre id="fixture-report">Loading fixture</pre><script>const p=new URLSearchParams(location.search),f=document.querySelector('iframe');f.width=p.get('w')||390;f.height=p.get('h')||844;function fit(){const scale=Math.min(1,500/f.width);f.style.transform='scale('+scale+')';document.querySelector('#holder').style.height=f.height*scale+'px';}fit();addEventListener('resize',fit);for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{[f.width,f.height]=b.dataset.size.split(',');fit();};for(const b of document.querySelectorAll('[data-msg]'))b.onclick=()=>f.contentWindow.postMessage(b.dataset.msg,location.origin);f.src='qa-v34-scene.local.html?touchPreview=1&near&long';</script>
