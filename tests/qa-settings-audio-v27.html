<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Settings audio graph QA</title><style>body{font:16px system-ui;background:#fff6df;color:#17363d;padding:25px}button{padding:15px;margin:7px}pre{white-space:pre-wrap}</style><h1>Settings audio graph QA</h1><button id="full">Play at full mix</button><button id="quarter">Play at quarter mix</button><button id="zero">Play at zero gain</button><button id="stop">Stop all</button><audio id="p"></audio><audio id="e"></audio><pre id="out">Ready</pre><script type="module">
import{VoiceChannels}from'./voice-channels.mjs?v=27';
const p=document.querySelector('#p'),e=document.querySelector('#e'),out=document.querySelector('#out'),c=new VoiceChannels({player:p,enemy:e});let ctx,analyser,raf=0,peak=0,run=0,sourceCount=0;
function report(state){out.textContent=JSON.stringify({state,context:ctx?.state,sourceCount,playerGain:c.lanes.player.output?.gain.gain.value,enemyGain:c.lanes.enemy.output?.gain.gain.value,playerVolume:p.volume,peakRMS:peak,paused:p.paused,src:p.currentSrc,error:p.error?.code??null},null,2);}
async function play(level){const token=++run;cancelAnimationFrame(raf);c.stopAll();peak=0;if(!ctx){ctx=new AudioContext();const native=ctx.createMediaElementSource.bind(ctx);ctx.createMediaElementSource=el=>{sourceCount++;return native(el);};c.connectAudio(ctx);analyser=ctx.createAnalyser();analyser.fftSize=1024;c.lanes.player.output.gain.connect(analyser);}await ctx.resume();c.connectAudio(ctx);c.setVolume(level);c.play('player',{src:'assets/voice/han-fa-da-cai-20190513.mp3'},{preview:true,onError:()=>report('error')});const samples=new Float32Array(analyser.fftSize),started=performance.now();function tick(){if(run!==token)return;analyser.getFloatTimeDomainData(samples);peak=Math.max(peak,Math.sqrt(samples.reduce((a,v)=>a+v*v,0)/samples.length));report(p.paused&&performance.now()-started>300?'complete':'playing');if(performance.now()-started<1800)raf=requestAnimationFrame(tick);}tick();}
document.querySelector('#full').onclick=()=>play(1);document.querySelector('#quarter').onclick=()=>play(.25);document.querySelector('#zero').onclick=()=>play(0);document.querySelector('#stop').onclick=()=>{run++;cancelAnimationFrame(raf);c.stopAll();report('stopped');};
</script></html>
