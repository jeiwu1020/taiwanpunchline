<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparation allocation geometry fixture</title><style>body{font:14px system-ui;margin:20px;background:#eee8d8;color:#162e35}button,select{font:inherit;min-height:44px;margin:4px}iframe{display:block;border:0;background:#162e35;max-width:none}pre{white-space:pre-wrap}#frame-wrap{overflow:auto;border:2px solid #162e35;padding:8px}</style>
<h1>合成準備畫面量測</h1><p>僅記憶體 v4 合成存檔，不讀寫 localStorage。尺寸是 iframe 的實際 CSS 像素，不是截圖縮放。全套量測可由「依次量測」重做；另可手動測展開、加點、取消、保存及切換頁籤。</p><select id="size" aria-label="測試尺寸"></select><select id="rotation" aria-label="側轉方向"><option value="90">側轉 +90°</option><option value="-90">側轉 −90°</option></select><select id="mode" aria-label="準備用途"><option value="false">配點草稿</option><option value="true">戰鬥中唯讀</option></select><select id="container" aria-label="準備容器寬度"><option value="">自然容器寬度</option><option value="679">容器 679px</option><option value="680">容器 680px</option><option value="681">容器 681px</option></select><button id="load">載入</button><button id="measure">量測此頁</button><button id="matrix">依次量測六尺寸（自然寬度）</button><div id="frame-wrap"><iframe id="frame" title="合成出戰準備"></iframe></div><pre id="result" aria-live="polite"></pre>
<script type="module">
import {frameRequest} from './fixture-requests.mjs';
const sizes=[['portrait390',390,844,0],['portrait320',320,568,0],['native844',844,390,0],['sideways390',390,844,90],['native932',932,430,0],['native568',568,320,0]],frame=document.querySelector('#frame'),output=document.querySelector('#result'),select=document.querySelector('#size');
sizes.forEach(([name,w,h],i)=>select.add(new Option(`${name} · ${w}×${h}`,i)));
async function load(index=+select.value,{source='single-profile'}={}){const request=frameRequest(sizes[index],{rotation:+document.querySelector('#rotation').value,readOnly:document.querySelector('#mode').value==='true',containerWidth:document.querySelector('#container').value,source});select.value=index;frame.width=request.width;frame.height=request.height;const ready=new Promise(resolve=>frame.onload=resolve);frame.src=request.src;await ready;await frame.contentWindow.preparationReady;return frame.contentWindow.preparationQA;}
document.querySelector('#load').onclick=()=>load();document.querySelector('#measure').onclick=()=>output.textContent=JSON.stringify(frame.contentWindow.preparationQA.measure(),null,2);
document.querySelector('#matrix').onclick=async()=>{document.querySelector('#container').value='';const rows=[];for(let i=0;i<sizes.length;i++){const qa=await load(i,{source:'six-size-natural-matrix'});rows.push({matrixSource:'six-size-natural-matrix',...await qa.measureStates()});output.textContent=JSON.stringify(rows,null,2);}window.preparationGeometryMatrix=rows;};await load();
</script></html>
