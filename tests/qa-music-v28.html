<!doctype html><meta charset="utf-8"><title>V28 music QA</title><style>body{font:16px system-ui}button{padding:12px;margin:5px}pre{white-space:pre-wrap}</style><h1>V28 real Web Audio check</h1><button id="unlock">Unlock / Retry</button><button id="battle">Battle new round</button><button id="menu">Menu / settings</button><button id="resume">Resume battle</button><button id="hide">Hide audio</button><button id="show">Show audio</button><button id="quarter">25% music</button><button id="zero">0% music</button><button id="full">100% music</button><button id="mute">Master mute</button><button id="unmute">Unmute</button><pre id="out"></pre><script type="module">
import{createBackgroundMusic}from'./background-music.mjs?v=28';
let ctx,analyser,facade,created=0,live=0,maxLive=0,peakRMS=0,stops=0,starts=[];const log=[];
function context(){if(facade)return facade;ctx=new(window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.connect(ctx.destination);facade={get state(){return ctx.state;},get currentTime(){return ctx.currentTime;},destination:analyser,resume:()=>ctx.resume(),createGain:()=>ctx.createGain(),decodeAudioData:b=>ctx.decodeAudioData(b),createBufferSource(){const n=ctx.createBufferSource(),start=n.start.bind(n),stop=n.stop.bind(n);let active=false;created++;n.start=(...args)=>{start(...args);active=true;live++;maxLive=Math.max(maxLive,live);starts.push({key:music.state.key,offset:args[1],loop:n.loop,duration:n.buffer.duration});};n.stop=(...args)=>{if(active){active=false;live--;stops++;}return stop(...args);};return n;}};return facade;}
const music=createBackgroundMusic({getContext:context,tracks:{menu:{src:'assets/music/fluffing-a-duck-menu-v28.mp3',label:'Fluffing a Duck'},battle:{src:'assets/music/run-amok-battle-v28.mp3',label:'Run Amok'}},onState:s=>{log.push({key:s.key,status:s.status,offset:s.offset});if(log.length>14)log.shift();}});const $=id=>document.getElementById(id);
$('unlock').onclick=()=>music.unlock();$('battle').onclick=()=>music.select('battle',{restart:true});$('menu').onclick=()=>music.select('menu');$('resume').onclick=()=>music.select('battle');$('hide').onclick=()=>music.setHidden(true);$('show').onclick=()=>music.setHidden(false);for(const [id,value]of[['quarter',.25],['zero',0],['full',1]])$(id).onclick=()=>{peakRMS=0;music.setPreferences({musicVolume:value,musicMuted:false,masterMuted:false});};$('mute').onclick=()=>{peakRMS=0;music.setPreferences({masterMuted:true});};$('unmute').onclick=()=>music.setPreferences({masterMuted:false});setInterval(()=>{if(analyser){const values=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(values);const rms=Math.sqrt(values.reduce((s,v)=>s+v*v,0)/values.length);peakRMS=Math.max(peakRMS,rms);}$('out').textContent=JSON.stringify({state:music.state,ctx:ctx?.state,created,live,maxLive,stops,peakRMS,starts:starts.slice(-8),log},null,2);},150);
</script>
