<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Isolated challenge menu QA</title><style>body{margin:12px;font:14px sans-serif;background:#eee}button,a{display:inline-block;margin:4px;padding:8px}iframe{display:block;border:2px solid #333;background:white}pre{white-space:pre-wrap;max-width:1000px}</style><h1>Isolated challenge menu QA</h1><nav id="sizes"></nav><nav id="actions"></nav><iframe id="qa-frame" title="Isolated real challenge menu"></iframe><pre id="qa-observation">Loading</pre><script type="module">
const sizes=[[320,568,0],[390,844,0],[430,932,0],[844,390,0],[568,320,0],[390,844,90],[390,844,-90],[1200,800,0]],frame=document.querySelector('iframe'),params=new URLSearchParams(location.search);let selected=Number(params.get('case'))||0,view=params.get('view')||'prep';
function load(fresh=false){const[w,h,rotation]=sizes[selected];frame.width=w;frame.height=h;frame.src=`./index.html?rotation=${rotation}&view=${view}${fresh?'&fresh=1':''}`;document.querySelector('#qa-observation').textContent='Loading '+[w,h,rotation].join(' / ');}
sizes.forEach(([w,h,r],i)=>{const b=document.createElement('button');b.textContent=`${w}×${h} / ${r}°`;b.onclick=()=>{selected=i;load();};document.querySelector('#sizes').append(b);});
for(const [name,action]of [['Open preparation','prep'],['Read-only Han','readonly'],['Open save manager','save'],['Open overview','chapter'],['Simulate quota failure','fail'],['Restore writes','recover'],['Reload current frame','reload'],['Fresh synthetic fixture','fresh']]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{if(action==='reload')frame.contentWindow.location.reload();else if(action==='fresh')load(true);else frame.contentWindow.postMessage({task5Action:action},location.origin);};document.querySelector('#actions').append(b);}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.task5State)document.querySelector('#qa-observation').textContent=JSON.stringify(e.data.task5State,null,2);});load(params.has('fresh'));
</script></html>
