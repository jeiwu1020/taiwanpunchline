<!doctype html><meta charset="utf-8"><title>V13 pose audit</title><style>body{margin:0;background:#e7e0c9;color:#142b32;font:14px system-ui}header{padding:8px;display:flex;gap:20px;align-items:center}canvas{width:1160px;height:690px}button,select{font:inherit}</style><header><label>角色<select id="who"></select></label><strong>V13 每招起手／命中／收招／反面</strong><span id="state">載入</span></header><canvas id="sheet" width="1160" height="690"></canvas><script type="module">
import {CAST,Duel} from './core.mjs?v=13';import {loadArtImages,drawFighterArt} from './art-render.mjs?v=13';import {COMBAT} from './combat-rules.mjs?v=13';
const images=await loadArtImages(),sel=document.querySelector('#who'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');

</script>
